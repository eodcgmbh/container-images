name: Build and publish JupyterHub hub image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of the fork to build (empty: SOURCE_REF from jupyterhub/build.env)"
        required: false
        default: ""

concurrency:
  # parallel runs would read the same last tag and push the same version
  group: jupyterhub-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Load config
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          grep -Ev '^[[:space:]]*(#|$)' jupyterhub/build.env >> "$GITHUB_ENV"
          . ./jupyterhub/build.env
          echo "REF=${INPUT_REF:-$SOURCE_REF}" >> "$GITHUB_ENV"

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.REF }}
          path: jupyterhub-src
          # setuptools-scm derives the package version from git history
          fetch-depth: "0"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        working-directory: jupyterhub-src
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          ref=$(echo "$REF" | tr -c 'A-Za-z0-9_.\n-' '-')
          # GHCR rejects uppercase in image paths
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY,,}/${GHCR_IMAGE_NAME}"

          if [ "$REF" = "$SOURCE_REF" ]; then
            # Harbor is the source of truth for the counter; a failed lookup
            # must abort, otherwise the month restarts at .1 and overwrites
            prefix="$(TZ=Europe/Vienna date +%Y.%-m)."
            existing=$(skopeo list-tags "docker://${REGISTRY}/${IMAGE_NAME}")
            last=$(echo "$existing" \
              | jq -r --arg p "$prefix" '.Tags[]? | select(startswith($p)) | ltrimstr($p) | select(test("^[0-9]+$"))' \
              | sort -n | tail -n1)
            version="${prefix}$(( ${last:-0} + 1 ))"
          fi

          {
            echo "tags<<EOF"
            for image in "${REGISTRY}/${IMAGE_NAME}" "$ghcr_image"; do
              echo "${image}:sha-${sha}"
              echo "${image}:${ref}"
              if [ -n "${version:-}" ]; then
                echo "${image}:${version}"
                echo "${image}:latest"
              fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: jupyterhub-src
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # GHA cache is shared by all workflows in this repo
          cache-from: type=gha,scope=jupyterhub
          cache-to: type=gha,scope=jupyterhub,mode=max

      - name: Image tags
        run: echo "${{ steps.tags.outputs.tags }}"
